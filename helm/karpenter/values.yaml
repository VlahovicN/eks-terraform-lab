image:
  repository: public.ecr.aws/karpenter/controller
  tag: 1.12.1

controller:
  resources:
    limits:
      cpu: 1
      memory: 1Gi
    requests:
      cpu: 1
      memory: 1Gi

settings:
  clusterName: eks-lab
  interruptionQueue: Karpenter-eks-lab

tolerations:
- effect: NoSchedule
  key: CriticalAddonsOnly
  operator: Exists