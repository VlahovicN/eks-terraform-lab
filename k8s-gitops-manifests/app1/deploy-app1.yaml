apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-eso-test
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app1-eso-test
  template:
    metadata:
      labels:
        app: app1-eso-test
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                - key: "standard-node"
                  operator: "In"
                  values:
                    - "true"
      tolerations:
        - key: "standard-taint"
          operator: "Exists"
          effect: "NoSchedule"

      containers:
      - name: tester
        image: alpine:latest
        command: ["/bin/sh", "-c", "sleep infinity"]
        resources:
          requests:
            cpu: "10m"
            memory: "32Mi"
          limits:
            cpu: "50m"
            memory: "64Mi"
        envFrom:
          - secretRef:
              name: eso-config
        