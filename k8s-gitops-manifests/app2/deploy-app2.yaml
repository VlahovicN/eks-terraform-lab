apiVersion: v1
kind: ServiceAccount
metadata:
  name: app2-sa
  namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2-sqs-test
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app2-sqs-test
  template:
    metadata:
      labels:
        app: app2-sqs-test
    spec:
      serviceAccountName: app2-sa
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                - key: "priority-node"
                  operator: "In"
                  values:
                    - "true"
      tolerations:
        - key: "priority-taint"
          operator: "Exists"
          effect: "NoSchedule"

      containers:
      - name: tester
        image: alpine:latest
        command: ["/bin/sh", "-c", "sleep infinity"]
        resources:
          requests:
            cpu: "500m"
            memory: "900Mi"
          limits:
            cpu: "600m"
            memory: "1000Mi"
        envFrom:
          - secretRef:
              name: eso-config
