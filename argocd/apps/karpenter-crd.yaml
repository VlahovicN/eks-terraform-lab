apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-crd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"   # CRDs first - NodePool/EC2NodeClass CRs (eks-lab-manifests) need them
spec:
  project: default
  source:
    repoURL: public.ecr.aws/karpenter   # OCI registry - no oci:// prefix here, ArgoCD infers it from repoURL+chart
    chart: karpenter-crd
    targetRevision: "1.12.1"
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
