apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"   # Ships its own CRDs (ClusterSecretStore/ExternalSecret) - must be Healthy before eks-lab-manifests
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: "2.11.0"
    helm:
      # Mirrors helm/eso/values.yaml
      values: |
        global:
          tolerations:
            - key: "CriticalAddonsOnly"
              operator: "Exists"
              effect: "NoSchedule"
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # ESO's CRDs (ClusterSecretStore/SecretStore) are too large for the
                                 # kubectl.kubernetes.io/last-applied-configuration annotation (256KB
                                 # cap) that default client-side apply embeds - SSA skips that entirely.
