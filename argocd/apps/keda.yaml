apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"   # CRDs (ScaledObject/TriggerAuthentication) must exist before eks-lab-manifests
spec:
  project: default
  source:
    repoURL: https://kedacore.github.io/charts
    chart: keda
    targetRevision: "2.19.0"
    helm:
      values: |
        metricsServer:
          enabled: true
        tolerations:
          - key: CriticalAddonsOnly
            operator: Exists
            effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true   # KEDA CRDs are large; SSA avoids the 256KB last-applied-configuration limit
